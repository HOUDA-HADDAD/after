name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  verify:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Phase 1 onwards: integration tests run against this.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aftergame
          POSTGRES_PASSWORD: aftergame
          POSTGRES_DB: aftergame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aftergame"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aftergame:aftergame@localhost:5432/aftergame_test
      # Tier 1: use the service container above rather than booting an embedded server.
      TEST_DATABASE_URL: postgresql://aftergame:aftergame@localhost:5432/aftergame_test
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      APP_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the build on a known vulnerability at moderate severity or above.
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      # Every dependency must carry a permissive licence — the project is free to self-host.
      - name: Check licences
        run: pnpm dlx license-checker-rseidelsohn --production --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;PostgreSQL;BlueOak-1.0.0;Python-2.0;CC-BY-4.0" --excludePrivatePackages

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
