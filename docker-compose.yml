# Local development dependencies.
#
#   docker compose up -d      start PostgreSQL and Adminer
#   docker compose down       stop them (data survives in the named volume)
#   docker compose down -v    stop and wipe the database
#
# Production uses docker/docker-compose.prod.yml — see docs/09-deployment.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: aftergame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aftergame
      POSTGRES_PASSWORD: aftergame
      POSTGRES_DB: aftergame
      # Deterministic collation, so index ordering matches production exactly.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aftergame -d aftergame']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Optional: a browser UI for the database at http://localhost:8080
  adminer:
    image: adminer:5
    container_name: aftergame-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: aftergame-postgres-data
